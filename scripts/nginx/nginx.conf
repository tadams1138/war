events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # war-api, running plain HTTP internally on 3001 -- nginx is the only
    # thing that ever speaks TLS. Prefix preserved, mirrors war-spec.md
    # 12.3's real routing ("API, prefix preserved").
    location /api/ {
      proxy_pass http://host.docker.internal:3001/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # war-ui-default's Vite dev server, including HMR's websocket.
    location / {
      proxy_pass http://host.docker.internal:5173/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
