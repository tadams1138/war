# war-ui-default pipeline — see specs/war-infra-spec.md §8.2
#
# App Platform builds the static site from source on deployment, so the `build`
# step here is a fast-fail check rather than the artefact that ships. Deploying
# is therefore just triggering a new deployment — no artefact upload.
#
# Per-environment GitHub Environment variables:
#   DO_APP_ID          App Platform app id for that environment
#   PUBLIC_BASE_URL    https://staging.war.tmad.dev | https://war.tmad.dev
#
# The production approval gate is a required reviewer on the `production`
# GitHub Environment, not a step in this file.

name: war-ui-default Pipeline

# Path-filtered so an API-only change doesn't rebuild and redeploy the static
# site. The two lists are duplicated on purpose — GitHub Actions does not
# support YAML anchors, so a shared alias here would fail to parse.
on:
  push:
    branches: [master]
    paths:
      - 'war-ui-default/**'
      - 'war-infra/scripts/smoke-test.sh'
      - '.github/workflows/ui-default.yml'
  pull_request:
    branches: [master]
    paths:
      - 'war-ui-default/**'
      - 'war-infra/scripts/smoke-test.sh'
      - '.github/workflows/ui-default.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Every `run:` below executes inside war-ui-default/. Steps taking a path
    # argument (setup-node's cache lookup, upload-artifact) still resolve from
    # the repository root and name the subdirectory explicitly.
    defaults:
      run:
        working-directory: war-ui-default

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: war-ui-default/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Acceptance tests run against MSW mocks, so they run on every PR without
      # needing a live API.
      - name: Acceptance tests
        run: npm run test:acceptance

      - name: Build
        run: npm run build

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Resolved from the repository root, not the job's working-directory.
          path: war-ui-default/playwright-report/
          retention-days: 7

  deploy-staging:
    name: Deploy → Staging
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.PUBLIC_BASE_URL }}
    # Serializes reruns of THIS pipeline's own staging deploy against itself.
    # Deliberately NOT shared with api.yml's staging group, even though both
    # write to the same App Platform app: GitHub keeps only one *pending*
    # run per concurrency group, and a job queued at an approval gate is
    # pending, not running — a shared group lets the other pipeline's job
    # evict it there, silently. That cancelled a live production security
    # fix (commit 9404ffe) for seven days. See specs/war-infra-spec.md
    # §20.8.
    # Do not unify this with api.yml's group.
    concurrency:
      group: deploy-staging-ui
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy
        run: doctl apps create-deployment "${{ vars.DO_APP_ID }}" --wait

      # Hashed assets are immutable and never need purging; only index.html does.
      - name: Purge edge cache
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "$(printf '{"files":["%s/index.html","%s/ui/default/index.html"]}' \
                      "${{ vars.PUBLIC_BASE_URL }}" "${{ vars.PUBLIC_BASE_URL }}")"

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: war-infra/scripts/smoke-test.sh staging ui-default

  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_BASE_URL }}
    # Serializes reruns of THIS pipeline's own production deploy against
    # itself. Deliberately NOT shared with api.yml's production group, even
    # though both write to the same App Platform app: GitHub keeps only one
    # *pending* run per concurrency group, and a job queued at the
    # production approval gate is pending, not running — a shared group
    # lets the other pipeline's job evict it there, silently. That
    # cancelled a live production security fix (commit 9404ffe) for seven
    # days. See specs/war-infra-spec.md §20.8.
    # Do not unify this with api.yml's group.
    concurrency:
      group: deploy-production-ui
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy
        run: doctl apps create-deployment "${{ vars.DO_APP_ID }}" --wait

      - name: Purge edge cache
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "$(printf '{"files":["%s/index.html","%s/ui/default/index.html"]}' \
                      "${{ vars.PUBLIC_BASE_URL }}" "${{ vars.PUBLIC_BASE_URL }}")"

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: war-infra/scripts/smoke-test.sh production ui-default
