# war-api pipeline — see specs/war-spec.md
#
# Per-environment GitHub Environment variables:
#   DO_APP_ID          App Platform app id for that environment
#   PUBLIC_BASE_URL    https://staging.war.tmad.dev | https://war.tmad.dev
#
# Repository secrets/variables (spec) — substituted into
# war-infra/platform/{env}.yaml by envsubst on every deploy, same mechanism as
# ${IMAGE_TAG}:
#   JWT_SECRET, INTERNAL_TASK_TOKEN,
#   GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_SECRET, FACEBOOK_CLIENT_SECRET, TWITTER_CLIENT_SECRET   secrets
#   GOOGLE_CLIENT_ID, MICROSOFT_CLIENT_ID, FACEBOOK_CLIENT_ID, TWITTER_CLIENT_ID   variables (not secrets)
#   SPACES_ACCESS_KEY_ID, SPACES_SECRET_ACCESS_KEY   secrets (same Spaces
#     credentials used elsewhere; substituted into the spec's S3_* keys)
#
# The production approval gate is a required reviewer on the `production`
# GitHub Environment, not a step in this file.

name: war-api Pipeline

# Path-filtered so a war-ui-default-only change neither rebuilds the image nor
# redeploys the API. war-infra/platform/** is in the list because the app spec
# this pipeline renders and applies lives there, so a change to it must reach
# the running app; smoke-test.sh likewise, since this pipeline executes it.
# The two lists are duplicated on purpose — GitHub Actions does not support
# YAML anchors, so a shared alias here would fail to parse rather than expand.
on:
  push:
    branches: [master]
    paths:
      - 'war-api/**'
      - '!war-api/**/*.md'
      - '!war-api/specs/features/pending/**'
      - 'war-infra/platform/**'
      - 'war-infra/scripts/smoke-test.sh'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [master]
    paths:
      - 'war-api/**'
      - '!war-api/**/*.md'
      - '!war-api/specs/features/pending/**'
      - 'war-infra/platform/**'
      - 'war-infra/scripts/smoke-test.sh'
      - '.github/workflows/api.yml'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/war
  IMAGE_NAME: war-api
  # The deployed runtime is 24.x, not the 22 this pinned before — see
  # specs/war-spec.md "Toolchain deviation".
  NODE_VERSION: '24'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: war_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/war_test

    # Every `run:` below executes inside war-api/. Steps that take a path
    # argument (setup-node's cache lookup, upload-artifact) are unaffected by
    # this and still resolve from the repository root, so they name the
    # subdirectory explicitly.
    defaults:
      run:
        working-directory: war-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: war-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Apply migrations to test database
        run: npm run migrate

      - name: Test (unit + integration)
        run: npm test

  build:
    name: Build image
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to DigitalOcean
        if: github.event_name != 'pull_request'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        run: doctl registry login --expiry-seconds 1800

      # On pull requests the image is built but not pushed. That still proves the
      # Dockerfile is sound before a change can merge.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # war-api/, not the repository root: the Dockerfile and the package
          # files it COPYs are all relative to that directory.
          context: war-api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy → Staging
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.PUBLIC_BASE_URL }}
    # Serializes reruns of THIS pipeline's own staging deploy against itself.
    # Deliberately NOT shared with ui-default.yml's staging group, even
    # though both write to the same App Platform app: GitHub keeps only one
    # *pending* run per concurrency group, and a job queued at an approval
    # gate is pending, not running — a shared group lets the other
    # pipeline's job evict it there, silently. That cancelled a live
    # production security fix (commit 9404ffe) for seven days. See
    # specs/war-spec.md.
    # Do not unify this with ui-default.yml's group.
    concurrency:
      group: deploy-staging-api
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Render app spec pinned to this commit's image
        env:
          IMAGE_TAG: ${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_TASK_TOKEN: ${{ secrets.INTERNAL_TASK_TOKEN }}
          S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          FACEBOOK_CLIENT_ID: ${{ vars.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          TWITTER_CLIENT_ID: ${{ vars.TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
        # The explicit variable list is load-bearing, not tidiness: envsubst
        # with no list substitutes every $VAR/${VAR} it finds, and
        # platform/{env}.yaml's run_command intentionally contains
        # $DATABASE_CA_CERT as a literal shell reference for the container to
        # expand at runtime (that's how it reads the platform-bound
        # ${db.CA_CERT}, which envsubst here has no way to know). An
        # unrestricted envsubst clobbered it with an empty string before it
        # ever reached the container -- confirmed via the App Platform
        # console, which showed the rendered command as `echo ""`, not
        # `echo "$DATABASE_CA_CERT"`. Every new ${PLACEHOLDER} added to
        # platform/{env}.yaml for this step to substitute must be added here
        # too, or it silently stops being substituted instead of erroring.
        run: |
          envsubst '$IMAGE_TAG $JWT_SECRET $INTERNAL_TASK_TOKEN $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY $GOOGLE_CLIENT_ID $GOOGLE_CLIENT_SECRET $MICROSOFT_CLIENT_ID $MICROSOFT_CLIENT_SECRET $FACEBOOK_CLIENT_ID $FACEBOOK_CLIENT_SECRET $TWITTER_CLIENT_ID $TWITTER_CLIENT_SECRET' \
            < war-infra/platform/staging.yaml > "$RUNNER_TEMP/app-spec.yaml"

      # --wait blocks until the deployment settles. The PRE_DEPLOY migration job
      # (spec) runs inside it, so a failed migration fails this step and the
      # previous revision keeps serving traffic.
      - name: Deploy
        run: doctl apps update "${{ vars.DO_APP_ID }}" --spec "$RUNNER_TEMP/app-spec.yaml" --wait

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: war-infra/scripts/smoke-test.sh staging api

  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_BASE_URL }}
    # Serializes reruns of THIS pipeline's own production deploy against
    # itself. Deliberately NOT shared with ui-default.yml's production
    # group, even though both write to the same App Platform app: GitHub
    # keeps only one *pending* run per concurrency group, and a job queued
    # at the production approval gate is pending, not running — a shared
    # group lets the other pipeline's job evict it there, silently. That
    # cancelled a live production security fix (commit 9404ffe) for seven
    # days. See specs/war-spec.md.
    # Do not unify this with ui-default.yml's group.
    concurrency:
      group: deploy-production-api
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Deploys the exact image already validated in staging — never a rebuild.
      - name: Render app spec pinned to this commit's image
        env:
          IMAGE_TAG: ${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_TASK_TOKEN: ${{ secrets.INTERNAL_TASK_TOKEN }}
          S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          FACEBOOK_CLIENT_ID: ${{ vars.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          TWITTER_CLIENT_ID: ${{ vars.TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
        # See the staging job's identical step for why the variable list is
        # required, not optional tidiness.
        run: |
          envsubst '$IMAGE_TAG $JWT_SECRET $INTERNAL_TASK_TOKEN $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY $GOOGLE_CLIENT_ID $GOOGLE_CLIENT_SECRET $MICROSOFT_CLIENT_ID $MICROSOFT_CLIENT_SECRET $FACEBOOK_CLIENT_ID $FACEBOOK_CLIENT_SECRET $TWITTER_CLIENT_ID $TWITTER_CLIENT_SECRET' \
            < war-infra/platform/production.yaml > "$RUNNER_TEMP/app-spec.yaml"

      - name: Deploy
        run: doctl apps update "${{ vars.DO_APP_ID }}" --spec "$RUNNER_TEMP/app-spec.yaml" --wait

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: war-infra/scripts/smoke-test.sh production api
