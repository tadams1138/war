# war-infra pipeline — see war-spec.md
#
# Spaces provides no state locking (spec), so the per-environment
# concurrency groups on the apply jobs below are what prevent two applies
# colliding. A workflow_dispatch run validates and plans (shared, staging and
# production) only; applies need a push to master.
#
# On a push, each plan job joins the concurrency group of its apply job. A newer
# plan then evicts an older run's apply still waiting at an approval gate: if
# commit B reverts commit A, B's plan shows no changes and B's apply is skipped,
# so without this A's pending apply would never be evicted and approving it
# would re-apply the reverted change. The plan and the apply of one run do not
# deadlock: the apply starts only after the plan has finished, and a group holds
# one running and one pending job. Off a push (pull request, dispatch) the group
# is unique per run, so those plans queue behind nothing and evict nothing.
#
# The production approval gate is a required reviewer on the `production`
# GitHub Environment, not a step in this file.
#
# Apply re-plans rather than consuming an uploaded plan file: plan output can
# contain secret values, and artefacts are readable by anyone with repo access.

name: war-infra Pipeline

# Scoped to war-infra/ so application-only commits don't run a plan. `paths`
# and `paths-ignore` are mutually exclusive for a single event, so the previous
# markdown exclusion is expressed as a negated pattern inside `paths` — later
# patterns override earlier ones.
#
# platform/** is excluded for the same reason: Terraform creates the App
# Platform app but does not own its spec (terraform/modules/compute carries
# `ignore_changes = [spec]`). Nothing under terraform/ reads those files
# — app.yml renders and applies them — so a platform/{env}.yaml edit would
# otherwise cost a full plan/apply cycle and a production approval to change
# nothing.
#
# tools/, scripts/, specs/ and bootstrap/ are excluded for the same reason:
# nothing under terraform/ reads them. edge/ stays in: Terraform reads the
# Worker sources via file().
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'war-infra/**'
      - '!war-infra/**/*.md'
      - '!war-infra/platform/**'
      - '!war-infra/tools/**'
      - '!war-infra/scripts/**'
      - '!war-infra/specs/**'
      - '!war-infra/bootstrap/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [master]
    paths:
      - 'war-infra/**'
      - '!war-infra/**/*.md'
      - '!war-infra/platform/**'
      - '!war-infra/tools/**'
      - '!war-infra/scripts/**'
      - '!war-infra/specs/**'
      - '!war-infra/bootstrap/**'
      - '.github/workflows/infra.yml'

# Every `run:` in this workflow executes inside war-infra/, so the
# `terraform -chdir=terraform/...` paths in the jobs below remain relative to
# it.
defaults:
  run:
    working-directory: war-infra

env:
  TF_VERSION: '1.9.8'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

  # Spaces credentials for the S3-compatible state backend (spec)
  AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}

  # Provider credentials
  TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_spaces_access_key: ${{ secrets.SPACES_ACCESS_KEY_ID }}
  TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}

  # internal_task_token is the only application secret Terraform consumes
  # (the scheduler module's Worker needs it to call the internal endpoint).
  # The rest — JWT_SECRET, GOOGLE_CLIENT_ID/SECRET, etc. — are not Terraform
  # inputs; they're substituted straight into platform/{env}.yaml by the
  # app.yml's render-spec step (spec).
  TF_VAR_internal_task_token: ${{ secrets.INTERNAL_TASK_TOKEN }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate modules
        run: |
          for env_dir in terraform/shared/ terraform/envs/*/; do
            echo "::group::validate ${env_dir}"
            terraform -chdir="$env_dir" init -backend=false
            terraform -chdir="$env_dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: Lint
        run: |
          tflint --init
          tflint --recursive

  plan-shared:
    name: Plan → Shared
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'push' && 'terraform-shared' || format('plan-shared-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      changes: ${{ steps.plan.outputs.changes }}

    steps:
      - uses: actions/checkout@v7

      # The setup-terraform wrapper swallows the raw exit code that
      # -detailed-exitcode reports, so turn it off for jobs that read it.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform -chdir=terraform/shared init

      # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
      # Record the verdict as a job output so the matching apply job can skip
      # itself when there is nothing to apply.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform -chdir=terraform/shared plan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

  # Account/zone-scoped (registry, Cloudflare zone settings) — applied once,
  # ahead of either environment. staging and production don't reference this
  # state directly, but envs/*/compute expects the registry to already exist
  # by the time it tries to create an app pointing at it (spec).
  apply-shared:
    name: Apply → Shared
    needs: plan-shared
    if: github.event_name == 'push' && needs.plan-shared.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # Gated: shared resources (Cloudflare zone settings, WAF/rate-limit rules,
    # the container registry) reach production without a staging pass first,
    # so a required reviewer on the `infra-shared` Environment approves them.
    environment: infra-shared
    concurrency:
      group: terraform-shared
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform -chdir=terraform/shared init

      - name: Apply
        run: terraform -chdir=terraform/shared apply -auto-approve

  plan-staging:
    name: Plan → Staging
    needs: plan-shared
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'push' && 'terraform-staging' || format('plan-staging-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      changes: ${{ steps.plan.outputs.changes }}

    steps:
      - uses: actions/checkout@v7

      # The setup-terraform wrapper swallows the raw exit code that
      # -detailed-exitcode reports, so turn it off for jobs that read it.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform -chdir=terraform/envs/staging init

      # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
      # Record the verdict as a job output so the matching apply job can skip
      # itself when there is nothing to apply.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform -chdir=terraform/envs/staging plan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

  apply-staging:
    name: Apply → Staging
    needs: [plan-staging, apply-shared]
    if: github.event_name == 'push' && !cancelled() && needs.plan-staging.result == 'success' && needs.plan-staging.outputs.changes == 'true' && contains(fromJSON('["success","skipped"]'), needs.apply-shared.result)
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: terraform-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform -chdir=terraform/envs/staging init

      - name: Apply
        run: terraform -chdir=terraform/envs/staging apply -auto-approve

  plan-production:
    name: Plan → Production
    # plan-staging and apply-shared are listed too so the failure check below
    # sees them, and only positive results open this stage: a failed validate
    # or plan-shared leaves everything downstream skipped, which must not pass.
    needs: [plan-staging, apply-shared, apply-staging]
    if: github.event_name != 'pull_request' && !cancelled() && needs.plan-staging.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.apply-shared.result) && contains(fromJSON('["success","skipped"]'), needs.apply-staging.result)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'push' && 'terraform-production' || format('plan-production-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      changes: ${{ steps.plan.outputs.changes }}

    steps:
      - uses: actions/checkout@v7

      # The setup-terraform wrapper swallows the raw exit code that
      # -detailed-exitcode reports, so turn it off for jobs that read it.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform -chdir=terraform/envs/production init

      # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
      # Record the verdict as a job output so the matching apply job can skip
      # itself when there is nothing to apply.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform -chdir=terraform/envs/production plan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

  apply-production:
    name: Apply → Production
    needs: plan-production
    if: github.event_name == 'push' && needs.plan-production.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform -chdir=terraform/envs/production init

      - name: Apply
        run: terraform -chdir=terraform/envs/production apply -auto-approve
