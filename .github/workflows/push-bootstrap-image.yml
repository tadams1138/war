name: Push bootstrap placeholder image

# Manual, one-off publish of the trivial image that
# war-infra/terraform/modules/compute/main.tf pins the app's placeholder spec to (see
# war-infra/bootstrap/Dockerfile for why it exists). Not part of any deploy pipeline —
# re-run only if that tag is ever pruned from the registry.
on:
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/war
  IMAGE_NAME: war-api

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The placeholder's busybox base image comes from Docker Hub.
      # Retried, then best effort: if Docker Hub's auth endpoint is down, pulls fall back to anonymous.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin && exit 0
            sleep $((attempt * 10))
          done
          echo "::warning::Docker Hub login failed after 3 attempts; continuing with anonymous pulls."

      - name: Authenticate to DigitalOcean
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to container registry
        run: doctl registry login --expiry-seconds 1800

      - uses: docker/build-push-action@v5
        with:
          context: war-infra/bootstrap
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:bootstrap
